[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unisplat"
version = "0.1.0"
description = "Unified Spatio-Temporal Fusion via 3D Latent Scaffolds"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["."]
include = ["unisplat*"]

